<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire — Check Ban</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0a0c0f;
    --surface:  #111418;
    --surface2: #1a1e24;
    --border:   #252b34;
    --accent:   #ff6b00;
    --accent2:  #ffaa00;
    --safe:     #22d3a0;
    --danger:   #ff3b3b;
    --text:     #e8eaf0;
    --muted:    #5a6378;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 52px 16px 80px;
  }

  /* ── Header ── */
  header { text-align: center; margin-bottom: 44px; }

  .flame-icon {
    font-size: 48px;
    line-height: 1;
    margin-bottom: 12px;
    display: block;
    filter: drop-shadow(0 0 18px rgba(255,107,0,0.6));
  }

  h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(32px, 6vw, 52px);
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-top: 8px;
    letter-spacing: 0.3px;
  }

  /* ── Search ── */
  .search-wrap {
    width: 100%;
    max-width: 480px;
    margin-bottom: 32px;
  }

  .search-row {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    background: var(--surface);
    border: 1.5px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 13px 16px;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s;
    letter-spacing: 0.5px;
  }

  input[type="text"]::placeholder { color: var(--muted); }
  input[type="text"]:focus { border-color: var(--accent); }

  /* hide number arrows */
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button { -webkit-appearance: none; }

  button#checkBtn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border: none;
    border-radius: 10px;
    padding: 13px 22px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  button#checkBtn:hover   { opacity: 0.88; }
  button#checkBtn:active  { transform: scale(0.97); }
  button#checkBtn:disabled{ opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ── Result area ── */
  .result-area { width: 100%; max-width: 480px; }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* banner strip at top */
  .card-banner {
    height: 6px;
    width: 100%;
  }

  .card-banner.banned  { background: linear-gradient(90deg, var(--danger), #ff7b3b); }
  .card-banner.safe    { background: linear-gradient(90deg, var(--safe), #38bdf8); }

  .card-body { padding: 24px; }

  /* status badge */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 14px;
    border-radius: 20px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 20px;
  }

  .status-badge.banned {
    background: rgba(255,59,59,0.12);
    border: 1px solid rgba(255,59,59,0.3);
    color: var(--danger);
  }

  .status-badge.safe {
    background: rgba(34,211,160,0.1);
    border: 1px solid rgba(34,211,160,0.25);
    color: var(--safe);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .dot.banned { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  .dot.safe   { background: var(--safe);   box-shadow: 0 0 6px var(--safe); }

  /* info rows */
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .info-block {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 14px 12px;
  }

  .info-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 5px;
  }

  .info-value {
    font-family: 'Rajdhani', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    word-break: break-all;
  }

  .info-block.full { grid-column: 1 / -1; }

  .period-pill {
    display: inline-block;
    background: rgba(255,59,59,0.1);
    border: 1px solid rgba(255,59,59,0.25);
    color: var(--danger);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
    margin-top: 2px;
  }

  /* status/error messages */
  .msg {
    text-align: center;
    padding: 14px;
    font-size: 14px;
    color: var(--muted);
  }

  .error-box {
    background: rgba(255,59,59,0.07);
    border: 1px solid rgba(255,59,59,0.2);
    border-radius: 10px;
    padding: 16px 20px;
    color: var(--danger);
    font-size: 14px;
    text-align: center;
    animation: fadeUp 0.2s ease;
  }

  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2.5px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* warning note */
  .api-note {
    margin-top: 16px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }

  .api-note a { color: var(--muted); text-decoration: underline; }

  @media (max-width: 400px) {
    .info-grid { grid-template-columns: 1fr; }
    .info-block.full { grid-column: 1; }
  }
</style>
</head>
<body>

<header>
  <span class="flame-icon">🔥</span>
  <h1>FREE FIRE CHECK BAN</h1>
  <p class="subtitle">Ingresa un UID para verificar el estado de la cuenta</p>
</header>

<div class="search-wrap">
  <div class="search-row">
    <input type="text" id="uidInput" placeholder="Ej: 305000592" inputmode="numeric" autocomplete="off" />
    <button id="checkBtn" onclick="checkBan()">Verificar</button>
  </div>
</div>

<div class="result-area" id="resultArea"></div>

<script>
  const input = document.getElementById('uidInput');
  const btn   = document.getElementById('checkBtn');
  const area  = document.getElementById('resultArea');

  input.addEventListener('keydown', e => { if (e.key === 'Enter') checkBan(); });

  function setLoading(on) {
    btn.disabled = on;
    btn.innerHTML = on ? '<span class="spinner"></span>Verificando…' : 'Verificar';
  }

  function showError(msg) {
    area.innerHTML = `<div class="error-box">⚠️ ${msg}</div>`;
  }

  async function checkBan() {
    const uid = input.value.trim();
    if (!uid) return;

    if (!/^\d+$/.test(uid)) {
      showError('El UID solo debe contener números.');
      return;
    }

    setLoading(true);
    area.innerHTML = `<p class="msg"><span class="spinner"></span>Consultando base de datos…</p>`;

    try {
      const proxy = 'https://api.allorigins.win/raw?url=';
      const endpoint = `https://api-check-ban.vercel.app/check_ban/${uid}`;

      const res = await fetch(proxy + encodeURIComponent(endpoint));

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const json = await res.json();

      /* ── Handle API responses ── */

      // ID not found (204 / no_content)
      if (json.status === 204 || json.msg === 'no_content') {
        showError(`No se encontró ninguna cuenta con el UID <strong>${uid}</strong>.`);
        setLoading(false);
        return;
      }

      // Errors from API
      if (json.error === true || json.status === 400 || json.status === 404 || json.status === 500) {
        const detail = json.details || json.msg || 'Error desconocido.';
        showError(detail);
        setLoading(false);
        return;
      }

      // Success
      const d = json.data || {};
      const isBanned  = d.is_banned === 1;
      const nickname  = d.nickname  || '—';
      const region    = d.region    || '—';
      const period    = d.period    ?? 0;
      const displayId = d.id        || uid;

      const statusClass = isBanned ? 'banned' : 'safe';
      const statusText  = isBanned ? '🚫 CUENTA BANEADA' : '✅ CUENTA ACTIVA';
      const statusIcon  = isBanned ? '🚫' : '✅';

      const periodHTML = isBanned
        ? `<span class="period-pill">Duración: ${period === 0 ? 'Permanente' : period + ' días'}</span>`
        : `<span style="font-size:16px;font-weight:600;color:var(--safe)">Sin ban</span>`;

      area.innerHTML = `
        <div class="card">
          <div class="card-banner ${statusClass}"></div>
          <div class="card-body">
            <div class="status-badge ${statusClass}">
              <span class="dot ${statusClass}"></span>
              ${statusText}
            </div>

            <div class="info-grid">
              <div class="info-block full">
                <div class="info-label">Nombre de jugador</div>
                <div class="info-value">${nickname}</div>
              </div>

              <div class="info-block">
                <div class="info-label">UID</div>
                <div class="info-value" style="font-size:16px">${displayId}</div>
              </div>

              <div class="info-block">
                <div class="info-label">Región</div>
                <div class="info-value">${region}</div>
              </div>

              <div class="info-block full">
                <div class="info-label">Estado del ban</div>
                <div style="margin-top:4px">${periodHTML}</div>
              </div>
            </div>
          </div>
        </div>
        <p class="api-note">
          Datos proporcionados por <a href="https://github.com/paulafredo/api-check-ban-freefire" target="_blank" rel="noopener">api-check-ban-freefire</a>.
          La información puede no estar actualizada en tiempo real.
        </p>`;

    } catch (err) {
      showError('No se pudo conectar con la API. Intenta de nuevo más tarde.');
      console.error(err);
    }

    setLoading(false);
  }
</script>
</body>
</html>
