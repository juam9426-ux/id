<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Free Fire — UID Lookup</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #07090d;
  --surf:    #101520;
  --surf2:   #181f2e;
  --border:  #222c40;
  --gold:    #f5c518;
  --gold2:   #f09020;
  --blue:    #4a9eff;
  --text:    #e2e8f4;
  --muted:   #4e5f78;
  --muted2:  #8898b4;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 56px 16px 80px;
}

/* ── Header ── */
.header { text-align: center; margin-bottom: 48px; }

.ff-logo {
  font-size: 52px;
  line-height: 1;
  margin-bottom: 14px;
  display: block;
  filter: drop-shadow(0 0 24px rgba(245,197,24,0.5));
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%,100%{ filter: drop-shadow(0 0 18px rgba(245,197,24,0.4)); }
  50%    { filter: drop-shadow(0 0 32px rgba(245,197,24,0.75)); }
}

h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(38px, 8vw, 64px);
  font-weight: 800;
  letter-spacing: 1px;
  line-height: 1;
  color: var(--text);
}
h1 em {
  font-style: normal;
  background: linear-gradient(90deg, var(--gold), var(--gold2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.sub {
  margin-top: 10px;
  color: var(--muted2);
  font-size: 14px;
}

/* ── Card container ── */
.card {
  width: 100%;
  max-width: 420px;
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
}

/* search section */
.search-sec {
  padding: 24px 24px 20px;
  border-bottom: 1px solid var(--border);
}

label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted2);
  letter-spacing: 0.5px;
  margin-bottom: 7px;
}

.input-row {
  display: flex;
  gap: 10px;
}

input[type="text"] {
  flex: 1;
  background: var(--surf2);
  border: 1.5px solid var(--border);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 16px;
  padding: 12px 14px;
  border-radius: 10px;
  outline: none;
  transition: border-color 0.2s;
}
input::placeholder { color: var(--muted); }
input:focus { border-color: var(--gold); }

button {
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color: #0a0c10;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.5px;
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  cursor: pointer;
  transition: opacity 0.18s, transform 0.1s;
  white-space: nowrap;
}
button:hover   { opacity: 0.86; }
button:active  { transform: scale(0.96); }
button:disabled{ opacity: 0.35; cursor: not-allowed; transform: none; }

/* result section */
.result-sec { padding: 22px 24px; min-height: 60px; }

/* empty state */
.empty {
  text-align: center;
  padding: 12px 0 4px;
  color: var(--muted);
  font-size: 14px;
}

/* player result */
.player {
  display: flex;
  flex-direction: column;
  gap: 16px;
  animation: fadeUp 0.28s ease;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}

.player-name-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.nickname {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 32px;
  font-weight: 800;
  color: var(--text);
  word-break: break-word;
  line-height: 1.1;
}

.region-badge {
  flex-shrink: 0;
  background: rgba(74,158,255,0.1);
  border: 1px solid rgba(74,158,255,0.25);
  color: var(--blue);
  font-size: 12px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 20px;
  letter-spacing: 0.4px;
}

.info-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.info-box {
  background: var(--surf2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
}
.info-lbl { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.info-val {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  word-break: break-all;
}

/* loading / error */
.loading {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
  padding: 10px 0;
  color: var(--muted2);
  font-size: 14px;
}
.spinner {
  width: 18px; height: 18px;
  border: 2.5px solid rgba(255,255,255,0.08);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.65s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform:rotate(360deg); } }

.error {
  background: rgba(255,70,70,0.07);
  border: 1px solid rgba(255,70,70,0.2);
  border-radius: 10px;
  color: #f07070;
  font-size: 13px;
  padding: 12px 16px;
  text-align: center;
}

/* footer note */
.powered {
  margin-top: 10px;
  font-size: 11px;
  color: var(--muted);
  text-align: center;
}
.powered a { color: var(--muted); text-decoration: underline; }

/* history strip */
.history-sec {
  padding: 0 24px 20px;
  display: none;
}
.history-title {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
.history-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  background: var(--surf2);
  border: 1px solid var(--border);
  color: var(--muted2);
  font-size: 12px;
  font-weight: 600;
  padding: 4px 11px;
  border-radius: 20px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.chip:hover { border-color: var(--gold); color: var(--gold); }

@media(max-width:380px){
  .info-row { grid-template-columns: 1fr; }
  .player-name-row { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<div class="header">
  <span class="ff-logo">🔥</span>
  <h1>Free Fire<br><em>UID Lookup</em></h1>
  <p class="sub">Busca cualquier jugador por su UID</p>
</div>

<div class="card">
  <div class="search-sec">
    <label for="uidIn">UID del jugador</label>
    <div class="input-row">
      <input type="text" id="uidIn" placeholder="Ej: 6605263063" inputmode="numeric" autocomplete="off" />
      <button id="btn" onclick="lookup()">Buscar</button>
    </div>
  </div>

  <div class="result-sec" id="resultSec">
    <p class="empty">Ingresa un UID para ver el perfil</p>
  </div>

  <div class="history-sec" id="historySec">
    <div class="history-title">Búsquedas recientes</div>
    <div class="history-chips" id="historyChips"></div>
  </div>
</div>

<p class="powered" style="margin-top:16px">
  Powered by <a href="https://www.npmjs.com/package/free-fire-apis" target="_blank" rel="noopener">free-fire-apis</a> · MIT License
</p>

<!-- Library from jsDelivr -->
<script src="https://cdn.jsdelivr.net/npm/free-fire-apis@0.0.1/index.min.js"></script>

<script>
const uidIn   = document.getElementById('uidIn');
const btn     = document.getElementById('btn');
const resSec  = document.getElementById('resultSec');
const hisSec  = document.getElementById('historySec');
const hisChips= document.getElementById('historyChips');

let history = JSON.parse(localStorage.getItem('ff_history') || '[]');

uidIn.addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });

renderHistory();

function setLoading(on) {
  btn.disabled = on;
  btn.innerHTML = on
    ? '<span class="spinner"></span>'
    : 'Buscar';
}

function renderHistory() {
  if (!history.length) return;
  hisSec.style.display = 'block';
  hisChips.innerHTML = history.slice(-6).reverse().map(h =>
    `<span class="chip" onclick="loadHistory('${h}')">${h}</span>`
  ).join('');
}

function loadHistory(uid) {
  uidIn.value = uid;
  lookup();
}

function saveHistory(uid) {
  history = [...new Set([...history, uid])].slice(-10);
  localStorage.setItem('ff_history', JSON.stringify(history));
  renderHistory();
}

async function lookup() {
  const rawUid = uidIn.value.trim();
  if (!rawUid) return;
  if (!/^\d+$/.test(rawUid)) {
    resSec.innerHTML = `<div class="error">⚠️ El UID solo debe contener números.</div>`;
    return;
  }

  setLoading(true);
  resSec.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      Buscando jugador…
    </div>`;

  try {
    // The library exposes a global `uid` function
    if (typeof uid === 'undefined') throw new Error('lib_not_loaded');

    const data = await uid(rawUid);

    if (!data || (!data.Nickname && !data.nickname)) {
      resSec.innerHTML = `<div class="error">No se encontró ningún jugador con ese UID.</div>`;
      setLoading(false);
      return;
    }

    const name   = data.Nickname   || data.nickname   || '—';
    const region = data.Region     || data.region     || '—';
    const uidOut = data.Uid        || data.uid        || rawUid;
    const author = data.Author     || data.author     || '—';

    saveHistory(rawUid);

    resSec.innerHTML = `
      <div class="player">
        <div class="player-name-row">
          <div class="nickname">${name}</div>
          <span class="region-badge">${region}</span>
        </div>
        <div class="info-row">
          <div class="info-box">
            <div class="info-lbl">UID</div>
            <div class="info-val">${uidOut}</div>
          </div>
          <div class="info-box">
            <div class="info-lbl">Región</div>
            <div class="info-val">${region}</div>
          </div>
        </div>
      </div>`;

  } catch (err) {
    if (err.message === 'lib_not_loaded') {
      resSec.innerHTML = `<div class="error">La librería no cargó. Revisa tu conexión e intenta de nuevo.</div>`;
    } else {
      resSec.innerHTML = `<div class="error">UID inválido o error de red. Verifica el UID e intenta de nuevo.</div>`;
    }
    console.error(err);
  }

  setLoading(false);
}
</script>
</body>
</html>
