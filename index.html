<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar Jugador — Roblox</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --surface2: #1e2130;
    --border: #2a2f45;
    --accent: #00b4ff;
    --accent2: #7c3aed;
    --text: #e8eaf0;
    --muted: #6b7280;
    --success: #22d3a0;
    --error: #f87171;
    --card-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  .logo-mark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .subtitle {
    color: var(--muted);
    font-size: 15px;
    margin-top: 6px;
  }

  .search-box {
    width: 100%;
    max-width: 540px;
    margin-bottom: 32px;
  }

  .search-row {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    background: var(--surface);
    border: 1.5px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 12px 16px;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]::placeholder { color: var(--muted); }
  input[type="text"]:focus { border-color: var(--accent); }

  button {
    background: var(--accent);
    color: #000;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  button:hover { opacity: 0.88; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .result-area {
    width: 100%;
    max-width: 540px;
  }

  /* ── Profile card ── */
  .profile-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--card-shadow);
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    background: linear-gradient(135deg, #0d1a2e 0%, #12102a 100%);
    padding: 28px 24px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .card-header::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,180,255,0.07), rgba(124,58,237,0.07));
    pointer-events: none;
  }

  .avatar-wrap {
    position: relative;
    flex-shrink: 0;
  }

  .avatar-wrap img {
    width: 72px;
    height: 72px;
    border-radius: 12px;
    border: 2px solid var(--border);
    display: block;
    background: var(--surface2);
  }

  .avatar-placeholder {
    width: 72px;
    height: 72px;
    border-radius: 12px;
    background: var(--surface2);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }

  .user-meta { flex: 1; min-width: 0; }

  .username {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .display-name {
    color: var(--muted);
    font-size: 13px;
    margin-top: 2px;
  }

  .user-id {
    display: inline-block;
    margin-top: 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(0,180,255,0.1);
    border: 1px solid rgba(0,180,255,0.2);
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 0.3px;
  }

  .open-profile {
    flex-shrink: 0;
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text);
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 8px;
  }

  .open-profile:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }

  .card-body { padding: 20px 24px; }

  .bio {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 20px;
    min-height: 20px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .stat {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 10px;
    text-align: center;
  }

  .stat-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Friends */
  .section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .friends-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }

  .friends-row::-webkit-scrollbar { display: none; }

  .friend-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    min-width: 56px;
    cursor: pointer;
  }

  .friend-chip img {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    transition: border-color 0.2s;
  }

  .friend-chip:hover img { border-color: var(--accent); }

  .friend-chip span {
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    max-width: 56px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .no-friends {
    font-size: 13px;
    color: var(--muted);
  }

  /* Status bar */
  .status-msg {
    text-align: center;
    padding: 14px;
    font-size: 14px;
    color: var(--muted);
  }

  .error-msg {
    background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.2);
    border-radius: 10px;
    padding: 14px 18px;
    color: var(--error);
    font-size: 14px;
    text-align: center;
    animation: fadeUp 0.2s ease;
  }

  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2.5px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 16px 0;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .card-header { flex-wrap: wrap; }
    .open-profile { width: 100%; text-align: center; margin-top: 4px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-mark">
    <div class="logo-icon">🎮</div>
    <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;">RobloxLookup</span>
  </div>
  <h1>Buscar jugador</h1>
  <p class="subtitle">Ingresa un nombre de usuario para ver su perfil</p>
</header>

<div class="search-box">
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="ej. Builderman" autocomplete="off" />
    <button id="searchBtn" onclick="search()">Buscar</button>
  </div>
</div>

<div class="result-area" id="resultArea"></div>

<script>
  const input = document.getElementById('searchInput');
  const btn   = document.getElementById('searchBtn');
  const area  = document.getElementById('resultArea');

  input.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

  function fmt(n) {
    if (n == null) return '—';
    if (n >= 1_000_000) return (n/1_000_000).toFixed(1) + 'M';
    if (n >= 1_000)     return (n/1_000).toFixed(1) + 'K';
    return n.toString();
  }

  function setLoading(on) {
    btn.disabled = on;
    btn.innerHTML = on ? '<span class="spinner"></span>Buscando' : 'Buscar';
  }

  function showError(msg) {
    area.innerHTML = `<div class="error-msg">${msg}</div>`;
  }

  async function search() {
    const username = input.value.trim();
    if (!username) return;

    setLoading(true);
    area.innerHTML = `<p class="status-msg"><span class="spinner"></span>Buscando perfil…</p>`;

    try {
      /* 1. Resolve username → userId */
      const userRes = await fetch(
        `https://api.allorigins.win/get?url=${encodeURIComponent(
          `https://users.roblox.com/v1/usernames/users`
        )}`,
        {
          method: 'GET', // we'll POST via proxy differently below
        }
      );

      /* Use a CORS proxy for the POST request */
      const proxyBase = 'https://api.allorigins.win/raw?url=';

      // POST to resolve username
      const resolveRes = await fetch('https://api.allorigins.win/raw?url=' +
        encodeURIComponent('https://users.roblox.com/v1/usernames/users'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usernames: [username], excludeBannedUsers: false })
        }
      ).catch(() => null);

      let userId = null;

      if (resolveRes && resolveRes.ok) {
        const data = await resolveRes.json();
        if (data.data && data.data.length > 0) userId = data.data[0].id;
      }

      /* Fallback: search endpoint */
      if (!userId) {
        const searchRes = await fetch(
          proxyBase + encodeURIComponent(
            `https://users.roblox.com/v1/users/search?keyword=${encodeURIComponent(username)}&limit=5`
          )
        );
        if (searchRes.ok) {
          const sd = await searchRes.json();
          if (sd.data && sd.data.length > 0) {
            const match = sd.data.find(u => u.name.toLowerCase() === username.toLowerCase()) || sd.data[0];
            userId = match.id;
          }
        }
      }

      if (!userId) { showError(`No se encontró ningún usuario con el nombre "<strong>${username}</strong>".`); setLoading(false); return; }

      /* 2. Get user info */
      const [infoRes, friendsRes, followersRes, followingsRes] = await Promise.all([
        fetch(proxyBase + encodeURIComponent(`https://users.roblox.com/v1/users/${userId}`)),
        fetch(proxyBase + encodeURIComponent(`https://friends.roblox.com/v1/users/${userId}/friends?limit=10`)),
        fetch(proxyBase + encodeURIComponent(`https://friends.roblox.com/v1/users/${userId}/followers/count`)),
        fetch(proxyBase + encodeURIComponent(`https://friends.roblox.com/v1/users/${userId}/followings/count`)),
      ]);

      const info      = infoRes.ok      ? await infoRes.json()      : {};
      const friendsD  = friendsRes.ok   ? await friendsRes.json()   : {};
      const followersD= followersRes.ok ? await followersRes.json() : {};
      const followingsD=followingsRes.ok? await followingsRes.json(): {};

      const friends   = friendsD.data   || [];
      const follCount = followersD.count ?? '—';
      const folwCount = followingsD.count?? '—';

      /* 3. Avatar thumbnail */
      const avatarRes = await fetch(
        proxyBase + encodeURIComponent(
          `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=false`
        )
      );
      const avatarD = avatarRes.ok ? await avatarRes.json() : {};
      const avatarUrl = avatarD.data?.[0]?.imageUrl || null;

      /* 4. Friend avatars (batch) */
      let friendAvatars = {};
      if (friends.length) {
        const ids = friends.slice(0,10).map(f=>f.id).join(',');
        const faRes = await fetch(
          proxyBase + encodeURIComponent(
            `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${ids}&size=48x48&format=Png&isCircular=false`
          )
        );
        if (faRes.ok) {
          const faD = await faRes.json();
          (faD.data||[]).forEach(d => { friendAvatars[d.targetId] = d.imageUrl; });
        }
      }

      /* 5. Render */
      const created = info.created ? new Date(info.created).toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'}) : '—';
      const bio = info.description ? info.description.trim().slice(0,180) + (info.description.length > 180 ? '…' : '') : 'Sin descripción.';

      const avatarHTML = avatarUrl
        ? `<img src="${avatarUrl}" alt="Avatar de ${info.name}" />`
        : `<div class="avatar-placeholder">👤</div>`;

      const friendsHTML = friends.length
        ? friends.slice(0,10).map(f => `
            <div class="friend-chip" onclick="loadUser('${f.name}')">
              <img src="${friendAvatars[f.id] || ''}" alt="${f.name}"
                   onerror="this.style.display='none'" />
              <span>${f.name}</span>
            </div>`).join('')
        : `<p class="no-friends">Sin amigos públicos.</p>`;

      area.innerHTML = `
        <div class="profile-card">
          <div class="card-header">
            <div class="avatar-wrap">${avatarHTML}</div>
            <div class="user-meta">
              <div class="username">${info.name || username}</div>
              ${info.displayName && info.displayName !== info.name
                ? `<div class="display-name">${info.displayName}</div>` : ''}
              <span class="user-id">ID: ${userId}</span>
            </div>
            <a href="https://www.roblox.com/users/${userId}/profile" target="_blank" rel="noopener">
              <button class="open-profile">Ver en Roblox ↗</button>
            </a>
          </div>

          <div class="card-body">
            <p class="bio">${bio}</p>

            <div class="stats-grid">
              <div class="stat">
                <div class="stat-value">${fmt(follCount)}</div>
                <div class="stat-label">Seguidores</div>
              </div>
              <div class="stat">
                <div class="stat-value">${fmt(folwCount)}</div>
                <div class="stat-label">Siguiendo</div>
              </div>
              <div class="stat">
                <div class="stat-value">${created}</div>
                <div class="stat-label">Creado</div>
              </div>
            </div>

            <hr class="divider" />

            <p class="section-title">Amigos</p>
            <div class="friends-row">${friendsHTML}</div>
          </div>
        </div>`;

    } catch(err) {
      showError('Ocurrió un error al conectar con la API de Roblox. Intenta de nuevo.');
      console.error(err);
    }

    setLoading(false);
  }

  function loadUser(name) {
    input.value = name;
    search();
  }
</script>
</body>
</html>
