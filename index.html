<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Free Fire — Buscar Jugador</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #080C10;
    --surface:  #0D1318;
    --border:   #1A2530;
    --accent:   #00E5FF;
    --accent2:  #FF6B00;
    --text:     #E8EDF2;
    --muted:    #5A6A78;
    --success:  #00D084;
    --danger:   #FF4444;
    --radius:   4px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 24px;
  }

  header {
    width: 100%;
    max-width: 640px;
    padding: 48px 0 32px;
    text-align: center;
  }
  .logo-label {
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 700;
    line-height: 1.1;
    color: var(--text);
  }
  h1 span { color: var(--accent); }

  .search-wrap {
    width: 100%;
    max-width: 640px;
    margin-bottom: 32px;
  }
  .region-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .region-btn {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 8px 0;
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .region-btn.active,
  .region-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,229,255,.06);
  }
  .input-row {
    display: flex;
    gap: 10px;
  }
  input[type="text"] {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 18px;
    font-weight: 600;
    padding: 14px 16px;
    border-radius: var(--radius);
    outline: none;
    transition: border-color .15s;
  }
  input[type="text"]::placeholder { color: var(--muted); }
  input[type="text"]:focus { border-color: var(--accent); }
  button.search-btn {
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 14px 24px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: opacity .15s;
    white-space: nowrap;
  }
  button.search-btn:hover { opacity: .85; }
  button.search-btn:disabled { opacity: .4; cursor: not-allowed; }

  .status {
    width: 100%;
    max-width: 640px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    min-height: 24px;
    margin-bottom: 16px;
  }
  .status.error { color: var(--danger); }
  .dot-spin {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1s infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .3; transform: scale(.6); }
  }

  .card {
    width: 100%;
    max-width: 640px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: none;
  }
  .card.visible { display: block; }

  .card-top {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }
  .avatar-placeholder {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-family: 'Rajdhani', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
  }
  .player-main { flex: 1; min-width: 0; }
  .player-name {
    font-family: 'Rajdhani', sans-serif;
    font-size: 22px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-uid {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    font-family: monospace;
  }
  .badge {
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 2px;
    text-transform: uppercase;
  }
  .badge-active { background: rgba(0,208,132,.15); color: var(--success); border: 1px solid rgba(0,208,132,.3); }
  .badge-banned  { background: rgba(255,68,68,.15);  color: var(--danger);  border: 1px solid rgba(255,68,68,.3); }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    padding: 16px;
    border-right: 1px solid var(--border);
  }
  .stat:last-child { border-right: none; }
  .stat-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
  }
  .stat-value {
    font-family: 'Rajdhani', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-value.orange { color: var(--accent2); }

  .details-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .detail {
    padding: 14px 16px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .detail:nth-child(even) { border-right: none; }
  .detail:nth-last-child(-n+2) { border-bottom: none; }
  .detail-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .detail-value {
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 600;
  }

  @media (max-width: 480px) {
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .stats-grid .stat:nth-child(2) { border-right: none; }
    .stats-grid .stat:nth-child(3) { border-top: 1px solid var(--border); grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-label">Free Fire</div>
  <h1>Buscar <span>Jugador</span></h1>
</header>

<div class="search-wrap">
  <div class="region-row" id="regionRow">
    <button class="region-btn active" data-region="ind">IND</button>
    <button class="region-btn" data-region="sg">SG</button>
    <button class="region-btn" data-region="br">BR</button>
    <button class="region-btn" data-region="id">ID</button>
    <button class="region-btn" data-region="me">ME</button>
    <button class="region-btn" data-region="th">TH</button>
    <button class="region-btn" data-region="vn">VN</button>
    <button class="region-btn" data-region="bd">BD</button>
  </div>
  <div class="input-row">
    <input type="text" id="uidInput" placeholder="ID del jugador (UID)" maxlength="20" inputmode="numeric">
    <button class="search-btn" id="searchBtn" onclick="buscar()">Buscar</button>
  </div>
</div>

<div class="status" id="status"></div>

<div class="card" id="resultCard">
  <div class="card-top">
    <div class="avatar-placeholder" id="avatarBox">?</div>
    <div class="player-main">
      <div class="player-name" id="pName">—</div>
      <div class="player-uid" id="pUid">UID: —</div>
    </div>
    <span class="badge" id="banBadge">—</span>
  </div>
  <div class="stats-grid">
    <div class="stat">
      <div class="stat-label">Nivel</div>
      <div class="stat-value" id="pLevel">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Likes</div>
      <div class="stat-value orange" id="pLikes">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Región</div>
      <div class="stat-value" id="pRegion">—</div>
    </div>
  </div>
  <div class="details-grid">
    <div class="detail">
      <div class="detail-label">Gremio</div>
      <div class="detail-value" id="pGuild">—</div>
    </div>
    <div class="detail">
      <div class="detail-label">Rango BR</div>
      <div class="detail-value" id="pRankBR">—</div>
    </div>
    <div class="detail">
      <div class="detail-label">Rango CS</div>
      <div class="detail-value" id="pRankCS">—</div>
    </div>
    <div class="detail">
      <div class="detail-label">Último acceso</div>
      <div class="detail-value" id="pLastLogin">—</div>
    </div>
  </div>
</div>

<script>
  let region = 'ind';

  document.getElementById('regionRow').addEventListener('click', e => {
    const btn = e.target.closest('.region-btn');
    if (!btn) return;
    document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    region = btn.dataset.region;
  });

  document.getElementById('uidInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') buscar();
  });

  function setStatus(msg, isError = false, loading = false) {
    const el = document.getElementById('status');
    el.className = 'status' + (isError ? ' error' : '');
    el.innerHTML = loading ? `<span class="dot-spin"></span>${msg}` : msg;
  }

  function formatTimestamp(ts) {
    if (!ts) return '—';
    const d = new Date(Number(ts) * 1000);
    return d.toLocaleDateString('es', { day:'2-digit', month:'short', year:'numeric' });
  }

  async function buscar() {
    const uid = document.getElementById('uidInput').value.trim();
    if (!uid) { setStatus('Ingresa un UID válido.', true); return; }

    const btn = document.getElementById('searchBtn');
    btn.disabled = true;
    document.getElementById('resultCard').classList.remove('visible');
    setStatus('Buscando jugador…', false, true);

    try {
      // 👇 Cambia esta URL por la de tu API real
      const url = `https://TU-API.com/freefireinfo?uid=${encodeURIComponent(uid)}&region=${region}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Error ${res.status}`);
      const data = await res.json();

      const info   = data?.basicInfo   || data?.AccountInfo || data || {};
      const guild  = data?.guildBasicInfo || data?.guild    || {};
      const rankBR = data?.rankingInfo?.brRankPoint ?? data?.RankingInfo?.BrRankPoint ?? null;
      const rankCS = data?.rankingInfo?.csRankPoint ?? data?.RankingInfo?.CsRankPoint ?? null;

      const name      = info.nickname  ?? info.Nickname  ?? info.name ?? '—';
      const level     = info.level     ?? info.Level     ?? '—';
      const likes     = info.liked     ?? info.Liked     ?? info.exp  ?? '—';
      const lastLogin = info.lastLoginAt ?? info.LastLoginAt ?? null;
      const banStatus = data?.banInfo?.isInBlacklist ?? data?.BanInfo?.IsInBlacklist ?? false;

      document.getElementById('avatarBox').textContent = name.charAt(0).toUpperCase() || '?';
      document.getElementById('pName').textContent     = name;
      document.getElementById('pUid').textContent      = `UID: ${uid}`;
      document.getElementById('pLevel').textContent    = level;
      document.getElementById('pLikes').textContent    = Number(likes).toLocaleString('es');
      document.getElementById('pRegion').textContent   = region.toUpperCase();
      document.getElementById('pGuild').textContent    = guild.guildName ?? guild.GuildName ?? 'Sin gremio';
      document.getElementById('pRankBR').textContent   = rankBR !== null ? rankBR : '—';
      document.getElementById('pRankCS').textContent   = rankCS !== null ? rankCS : '—';
      document.getElementById('pLastLogin').textContent = formatTimestamp(lastLogin);

      const badge = document.getElementById('banBadge');
      badge.textContent = banStatus ? 'Baneado' : 'Activo';
      badge.className   = 'badge ' + (banStatus ? 'badge-banned' : 'badge-active');

      document.getElementById('resultCard').classList.add('visible');
      setStatus('');
    } catch (err) {
      setStatus(`No se encontró el jugador o la API no respondió. (${err.message})`, true);
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
